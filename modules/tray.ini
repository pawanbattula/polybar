[module/tray]
type = internal/tray

; Icons sit flush with the module's edges; a small margin keeps them
; from crowding the modules on either side.
format-margin = 4px

; Space between individual tray icons
tray-spacing = 4px

; Space added before/after each icon (inside the module)
tray-padding = 4px

; Icon size relative to bar height (bar height = 25px, so 70% ≈ 17px)
tray-size = 70%

; Background behind each individual icon (not the gaps between them) -
; match the bar background so icons blend in rather than showing boxes
tray-background = ${colors.bg}

; Hint sent to tray apps for icon coloring (GTK3 apps mostly honor this)
tray-foreground = ${colors.fg}