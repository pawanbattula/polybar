[module/ewmh]
type = internal/xworkspaces

; Don't pin workspaces to specific monitors - show all tags on all monitors
pin-workspaces = false

; Groups workspaces by monitor (new in version 3.7.0)
group-by-monitor = false

; Native click-to-focus (no xdotool needed for this module type)
enable-click = true

; Create scroll handlers used to cycle desktops
enable-scroll = false

format = <label-state>

label-active = %{T2}%index%%{T-}
label-active-foreground = ${colors.white}
label-active-padding = 1

label-occupied = %{T4}%index%%{T-}
label-occupied-foreground = ${colors.cyan}
label-occupied-padding = 1

label-urgent = %{T3}%index%%{T-}
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1

; Show empty tags too, dimmed, instead of hiding them
label-empty = %{T4}%index%%{T-}
label-empty-foreground = ${colors.fg-alt}
label-empty-padding = 1